# ProsperoPuzzles - Lint, test, build, and publish a release for each new version.
# Copyright (C) 2026 BlackBearReloaded
# SPDX-License-Identifier: GPL-3.0-or-later

name: Build

on:
  push:
    branches: [main]
    tags:
      - "[0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]"
      - "[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]"
  pull_request:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint, build, and package
    runs-on: ubuntu-24.04
    # The attest step signs with this run's identity and stores the attestation.
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      title-id: ${{ steps.version.outputs.title-id }}
      pkg-supported: ${{ steps.version.outputs.pkg-supported }}
      source-sha: ${{ steps.version.outputs.source-sha }}
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.deps/ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 clang-format-18 clang-tidy-18 libclang-rt-18-dev lld-18 make ninja-build ccache pkg-config tar unzip wget

      - name: Restore dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .deps/native
            .deps/test
            .deps/pacbrew
            .deps/ps5-opengl
          key: deps-${{ runner.os }}-${{ runner.arch }}-ubuntu24-python313-${{ hashFiles('tools/setup-*-dependencies.sh', 'tools/fetch-opengl-sdk.sh') }}

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps/ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-ubuntu24-clang18-${{ github.sha }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-ubuntu24-clang18-

      - name: Configure parallel compilation
        run: |
          echo "BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          ccache --zero-stats

      - name: Read app identity and version
        id: version
        shell: bash
        run: |
          metadata=$(python3 - <<'PY'
          import json

          with open("sce_sys/param.json", encoding="utf-8") as source:
              app = json.load(source)
          pkg_supported = app.get("applicationCategoryType") == 0 and app.get("applicationDrmType") == "free"
          print(app["titleId"], app["contentVersion"], str(pkg_supported).lower())
          PY
          )
          read -r title_id content_version pkg_supported <<< "$metadata"
          [[ $title_id =~ ^PPSA[0-9]{5}$ ]] || exit 2
          [[ $content_version =~ ^[0-9]{2}\.[0-9]{3}\.[0-9]{3}$ ]] || exit 2
          release_version=$content_version
          if [[ $content_version == 0[1-9].* ]]; then
            release_version=${content_version#0}
          fi
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "$release_version" ]]; then
            echo "Expected tag $release_version for param.json contentVersion $content_version" >&2
            exit 2
          fi
          echo "TITLE_ID=$title_id" >> "$GITHUB_ENV"
          echo "CONTENT_VERSION=$content_version" >> "$GITHUB_ENV"
          # Only a version tag push publishes a release.
          release=false
          if [[ $GITHUB_EVENT_NAME == push && $GITHUB_REF_TYPE == tag ]]; then
            release=true
          fi
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "title-id=$title_id" >> "$GITHUB_OUTPUT"
          echo "pkg-supported=$pkg_supported" >> "$GITHUB_OUTPUT"
          echo "source-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Release this build: $release ($content_version)"

      # A pull request's build is named by its number and its own commit, on the
      # artifact and inside the app folder (docs/PULL_REQUEST_BUILDS.md); the version
      # in param.json stays the release's.
      - name: Name this build
        id: label
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            short=${PR_HEAD:0:7}
            echo "artifact=${GITHUB_REPOSITORY##*/}-PR$PR_NUMBER-$short" >> "$GITHUB_OUTPUT"
            echo "BUILD_LABEL=PR $PR_NUMBER, $short" >> "$GITHUB_ENV"
          else
            echo "artifact=ProsperoPuzzles-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      # Clang static analysis stays a local check (make lint, make tidy).
      - name: Lint source and metadata
        run: LINT_SKIP_TIDY=1 make lint

      - name: Run host GoogleTest suite
        run: make test-unit

      - name: Run host integration tests
        run: make test-integration

      - name: Reproduce clean-room runtime shim
        run: make libc

      - name: Verify generated runtime is unchanged
        run: cd runtime && sha256sum -c libc.prx.sha256

      # The catalog and folder-based installs use the ZIP.
      - name: Build the release folder and ZIP
        run: make app

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Check the ZIP and write release checksums
        run: |
          python3 - "dist/$TITLE_ID.zip" "$TITLE_ID" <<'PY'
          import json
          import os
          import sys
          import zipfile
          archive, title = sys.argv[1:3]
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None, "damaged entry"
              names = z.namelist()
              assert all(n.startswith(title + "/") for n in names), "entries outside the app folder"
              for name in ("eboot.bin", "sce_module/libc.prx", "sce_sys/param.json",
                           "sce_sys/icon0.png", "sce_sys/pic0.dds", "sce_sys/pic1.dds", "sce_sys/snd0.at9"):
                  assert z.getinfo(f"{title}/{name}").file_size > 0, f"empty {name}"
              expected_native = {f"{title}/eboot.bin", f"{title}/sce_module/libc.prx"}
              actual_native = {name for name in names if name.endswith((".bin", ".prx", ".elf"))
                               and not name.startswith(f"{title}/assets/")}
              assert actual_native == expected_native, f"unexpected native files: {actual_native ^ expected_native}"
              metadata = json.loads(z.read(f"{title}/sce_sys/param.json"))
              assert metadata["titleId"] == title
              assert metadata["contentVersion"] == os.environ["CONTENT_VERSION"]
              wrong = [i.filename for i in z.infolist() if (i.external_attr >> 16) & 0o777 != 0o777]
              assert not wrong, f"entries not stored as 0777: {wrong[:3]}"
              print(f"{archive}: {len(names)} entries, all 0777")
          PY

          cd dist
          sha256sum "$TITLE_ID.zip" > SHA256SUMS

      - name: Build and verify the PS5 package
        if: steps.version.outputs.pkg-supported == 'true'
        run: |
          python -m pip install --no-index --no-deps --require-hashes \
            'https://github.com/BlackBearRevived/ps5-pkgkit/releases/download/v0.1.0/ps5_pkgkit-0.1.0-py3-none-any.whl#sha256=71cfa598c509322c6752c094486935a8334d7cf0fceb73e838810e46a3823541'
          ps5-pkgkit build "dist/$TITLE_ID" -o "dist/$TITLE_ID.pkg"
          ps5-pkgkit verify "dist/$TITLE_ID.pkg"
          cd dist
          sha256sum "$TITLE_ID.pkg" > "$TITLE_ID.pkg.sha256"

      # Public builds sign provenance for both formats.
      - name: Attest the ZIP and PKG
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/${{ env.TITLE_ID }}.zip
            dist/${{ env.TITLE_ID }}.pkg

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.label.outputs.artifact }}
          path: |
            dist/${{ env.TITLE_ID }}.zip
            dist/SHA256SUMS
            dist/${{ env.TITLE_ID }}.pkg
            dist/${{ env.TITLE_ID }}.pkg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: GitHub release
    if: needs.build.outputs.release == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      TITLE_ID: ${{ needs.build.outputs.title-id }}
      PKG_SUPPORTED: ${{ needs.build.outputs.pkg-supported }}

    steps:
      - name: Download verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "$GITHUB_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "ProsperoPuzzles-$GITHUB_SHA"
          --dir release

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          cd release
          mapfile -d '' files < <(find . -type f -print0)
          checksums=(SHA256SUMS)
          test -s "$TITLE_ID.zip"
          if [[ $PKG_SUPPORTED == true ]]; then
            test -s "$TITLE_ID.pkg"
            checksums+=("$TITLE_ID.pkg.sha256")
          fi
          if (( ${#files[@]} != 2 * ${#checksums[@]} )); then
            echo "Expected each title archive and its checksum file at the artifact root." >&2
            exit 1
          fi
          sha256sum -c --strict "${checksums[@]}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=$VERSION
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)" = "$SOURCE_SHA"
          assets=("release/$TITLE_ID.zip" release/SHA256SUMS)
          if [[ $PKG_SUPPORTED == true ]]; then
            assets+=("release/$TITLE_ID.pkg" "release/$TITLE_ID.pkg.sha256")
          fi
          # The files of a release come from the run of its tag, once. A release without a
          # ZIP (notes written in advance, or a draft) gets them and keeps its title and
          # notes; one that already has a ZIP is never touched, because the catalog records
          # that ZIP's checksum.
          if names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null); then
            has_zip=0
            while IFS= read -r name; do
              if [[ $name == *.zip ]]; then has_zip=1; fi
            done <<< "$names"
            if (( has_zip )); then
              echo "::warning title=Release files not from this run::A release for $TAG already has a ZIP; it was not replaced. Its files were not published by this run and may have no attestation."
            else
              gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
            fi
          else
            # Publish the build from the existing version tag that triggered this run.
            gh release create "$VERSION" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag --latest \
              --generate-notes \
              --title "ProsperoPuzzles $VERSION"
          fi
